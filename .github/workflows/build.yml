name: Build Rafiq Al Muslim APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/full-version
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android platform
        run: flutter create --platforms=android --project-name rafiq_al_muslim .
      - name: Add Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          idx = s.find('>')
          perms = '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
          if 'ACCESS_COARSE_LOCATION' not in s:
              s = s[:idx+1] + '\n' + perms + s[idx+1:]
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RafiqAlMuslim-APK
          path: build/app/outputs/flutter-apk/app-release.apk
