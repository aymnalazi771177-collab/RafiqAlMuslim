name: Build Rafiq Al Muslim APK
# Trigger a fresh build after dependency compatibility fix

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/full-version
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform
        run: |
          flutter create --platforms=android --project-name rafiq_al_muslim --org com.rafiqalmuslim /tmp/rafiq_android
          cp -R /tmp/rafiq_android/android ./android

      - name: Apply Rafiq Al Muslim launcher icon
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Image.open("assets/app_icon.jpg").convert("RGB")
          resources = Path("android/app/src/main/res")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              target = resources / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target / "ic_launcher.png", optimize=True)
              icon.save(target / "ic_launcher_round.png", optimize=True)

          # Use the generated density-specific icons on all Android versions.
          adaptive = resources / "mipmap-anydpi-v26"
          if adaptive.exists():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  path = adaptive / name
                  if path.exists():
                      path.unlink()
          PY

      - name: Add Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest'
          start = s.find('>')
          if start < 0:
              raise SystemExit("AndroidManifest.xml has no manifest root")
          perms = '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\\n'
          if 'ACCESS_COARSE_LOCATION' not in s:
              s = s[:start+1] + '\\n' + perms + s[start+1:]
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RafiqAlMuslim-APK
          path: build/app/outputs/flutter-apk/app-release.apk
